<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes</title>
<style>

header{padding:18px 3vw 12px;justify-content:flex-end}.toolbar{margin:0 3vw 14px}#board{display:block;position:relative;padding:0;height:75vh;min-height:550px;overflow:auto;border-width:6px;border-color:#9a7959}.note{position:absolute;width:260px;min-height:235px;transform:none;padding:36px 18px 14px;border-radius:3px 3px 10px 3px;box-shadow:1px 4px 8px #50351c35}.note:before{display:none}.note textarea{font:17px/1.55 system-ui,sans-serif;min-height:140px}.grip{position:absolute;top:0;left:0;width:100%;height:30px;border:0;border-bottom:1px solid #00000008;border-radius:0;background:#ffffff20;cursor:grab;touch-action:none;font-size:20px;color:#0006;letter-spacing:3px;padding:0}.grip:active{cursor:grabbing}.note.moving{box-shadow:3px 12px 20px #50351c55}.empty{position:sticky;left:0;width:100%;pointer-events:none}#count{font-size:12px;color:#756a5e}.actions{width:100%;justify-content:flex-end}.primary{margin-left:auto}@media(max-width:600px){#board{padding:0;min-height:65vh}.note{width:245px}header{padding-top:14px}.actions{gap:5px}.actions button{padding:9px}.toolbar{gap:8px}#search{width:100%}}

</style></head><body>
<nav class="tabs" aria-label="Workspace"><button id="notesTab" aria-pressed="true">Sticky notes</button><button id="calendarTab" aria-pressed="false">Calendar</button><button id="stretchTab" aria-pressed="false">Stretching</button></nav><header><div class="actions"><button id="export">Export backup</button><button id="import">Import backup</button><button class="primary" id="add">+ New note</button><input type="file" id="file" accept="application/json,.json" hidden></div></header>
<div class="toolbar"><div class="filters" aria-label="Filter notes"><button data-filter="all" aria-pressed="true">All notes</button><button data-filter="active" aria-pressed="false">To do</button><button data-filter="done" aria-pressed="false">Done</button></div><span id="count"></span><input id="search" type="search" placeholder="Find a note…" aria-label="Search notes"></div>
<main id="board" aria-label="Your corkboard"></main><section id="calendar" hidden aria-label="Calendar"><div class="caltools"><div><button id="prev" aria-label="Previous period">←</button> <button id="today">Today</button> <button id="next" aria-label="Next period">→</button></div><strong id="period" aria-live="polite"></strong><div><button id="month" aria-pressed="true">Month</button> <button id="week" aria-pressed="false">Week</button></div></div><div class="calwrap"><div id="calgrid"></div></div></section><section id="stretching" hidden aria-label="Stretching routine"><div class="routinebar"><span id="stretchCount"></span><button id="addStretch" class="primary">+ Add stretch</button></div><div id="stretchList"></div></section><dialog id="dayDialog"><form id="dayForm"><div class="dialoghead"><strong id="dayTitle"></strong><button type="button" id="closeDay" aria-label="Close day">×</button></div><div id="dayItems"></div><div class="entry"><input id="entryText" placeholder="Add an item…" maxlength="500" aria-label="New daily item" required><button class="primary">Add</button></div></form></dialog><footer><span>Saved in this browser · Export a backup to keep a copy</span><span id="status" role="status" aria-live="polite"></span></footer>
<script>
'use strict';
const KEY='ntobo-corkboard-v1',colors={Butter:'#fff0a6',Rose:'#f7c5c5',Sage:'#d3e1b7',Sky:'#c7e0eb',Lilac:'#dfd0ed'};
let notes=[],filter='all',topZ=1;const $=s=>document.querySelector(s),board=$('#board');
try{const raw=localStorage.getItem(KEY);if(raw!==null){const data=JSON.parse(raw);validate(data);notes=data;}}catch(e){$('#status').textContent='Could not load saved notes. Import a backup if needed.';}
function validate(data){if(!Array.isArray(data)||data.length>2000||data.some(n=>!n||typeof n.text!=='string'||n.text.length>100000||typeof n.done!=='boolean'||!Object.hasOwn(colors,n.color)))throw Error('Invalid backup');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes));$('#status').textContent='Saved on this device';}catch(e){$('#status').textContent='Saving failed. Export a backup before closing.';}count();}
function count(){$('#count').textContent=`${notes.filter(n=>!n.done).length} to do · ${notes.length} notes`;}
function render(){board.replaceChildren();count();const query=$('#search').value.toLowerCase();let visible=0;notes.forEach((n,i)=>{if((filter==='active'&&n.done)||(filter==='done'&&!n.done)||!n.text.toLowerCase().includes(query))return;visible++;const card=document.createElement('article');card.className='note'+(n.done?' done':'');
const columns=Math.max(1,Math.floor((board.clientWidth-32)/290));
if(!Number.isFinite(n.x)||n.x<0)n.x=18+(i%columns)*290;
if(!Number.isFinite(n.y)||n.y<0)n.y=18+Math.floor(i/columns)*290;
card.style.left=n.x+'px';card.style.top=n.y+'px';card.style.zIndex=++topZ;
const grip=document.createElement('button');grip.className='grip';grip.textContent='⠿';grip.setAttribute('aria-label','Move note. Drag or use arrow keys.');
let drag=null;
grip.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();grip.focus();card.style.zIndex=++topZ;drag={x:e.clientX,y:e.clientY,left:n.x,top:n.y,sx:board.scrollLeft,sy:board.scrollTop};grip.setPointerCapture(e.pointerId);card.classList.add('moving');};
grip.onpointermove=e=>{if(!drag)return;n.x=Math.max(0,Math.min(20000,drag.left+e.clientX-drag.x+board.scrollLeft-drag.sx));n.y=Math.max(0,Math.min(20000,drag.top+e.clientY-drag.y+board.scrollTop-drag.sy));card.style.left=n.x+'px';card.style.top=n.y+'px';};
const stop=()=>{if(!drag)return;drag=null;card.classList.remove('moving');save();};grip.onpointerup=stop;grip.onpointercancel=stop;grip.onlostpointercapture=stop;
grip.onkeydown=e=>{const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!delta)return;e.preventDefault();const step=e.shiftKey?30:10;n.x=Math.max(0,Math.min(20000,n.x+delta[0]*step));n.y=Math.max(0,Math.min(20000,n.y+delta[1]*step));card.style.left=n.x+'px';card.style.top=n.y+'px';card.style.zIndex=++topZ;save();};
card.addEventListener('pointerdown',()=>card.style.zIndex=++topZ);
card.style.setProperty('--paper',colors[n.color]);card.style.setProperty('--tilt',`${[ -1.2,1,.4,-.7][i%4]}deg`);const text=document.createElement('textarea');text.value=n.text;text.placeholder='Something to do, an idea to keep…';text.setAttribute('aria-label','Note text');text.oninput=()=>{n.text=text.value;save();};const foot=document.createElement('footer'),label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=n.done;check.onchange=()=>{n.done=check.checked;save();render();};label.append(check,document.createTextNode('Done'));const color=document.createElement('select');color.setAttribute('aria-label','Note color');Object.keys(colors).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;color.append(o);});color.value=n.color;color.onchange=()=>{n.color=color.value;card.style.setProperty('--paper',colors[n.color]);save();};const del=document.createElement('button');del.className='icon';del.textContent='×';del.setAttribute('aria-label','Delete note');del.onclick=()=>{if(n.text.trim()&&!confirm('Delete this note?'))return;notes.splice(i,1);save();render();};foot.append(label,color,del);card.append(grip,text,foot);board.append(card);});if(!visible){const empty=document.createElement('div');empty.className='empty';const h=document.createElement('h2');h.textContent=notes.length?'No matching notes':'No notes';const p=document.createElement('p');p.textContent=notes.length?'Change the filter or search.':'Click + New note to begin.';empty.append(h,p);board.append(empty);}}
$('#add').onclick=()=>{notes.push({text:'',done:false,color:Object.keys(colors)[notes.length%5],x:board.scrollLeft+18+(notes.length%4)*18,y:board.scrollTop+18+(notes.length%4)*18});filter='all';$('#search').value='';updateFilters();save();render();const fields=board.querySelectorAll('textarea');fields[fields.length-1].focus();};
function updateFilters(){document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;updateFilters();render();});$('#search').oninput=render;
render();
const CALKEY='ntobo-calendar-v1';let days={},view='month',anchor=new Date(),selected='';
function validDays(d){if(!d||typeof d!=='object'||Array.isArray(d))throw Error();for(const [k,v] of Object.entries(d)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(v)||v.length>1000||v.some(t=>!t||typeof t.text!=='string'||t.text.length>500||typeof t.done!=='boolean'))throw Error();}}
try{const stored=localStorage.getItem(CALKEY);if(stored){const d=JSON.parse(stored);validDays(d);days=d;}}catch(e){$('#status').textContent='Calendar could not load. Import a backup if needed.';}
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function saveDays(){try{localStorage.setItem(CALKEY,JSON.stringify(days));$('#status').textContent='Saved on this device';}catch(e){$('#status').textContent='Saving failed. Export a backup before closing.';}}
function switchTab(cal){$('#stretching').hidden=true;$('#stretchTab').setAttribute('aria-pressed','false');$('#board').hidden=cal;$('.toolbar').hidden=cal;$('#add').hidden=cal;$('#calendar').hidden=!cal;$('#notesTab').setAttribute('aria-pressed',!cal);$('#calendarTab').setAttribute('aria-pressed',cal);if(cal)renderCalendar();}
$('#notesTab').onclick=()=>switchTab(false);$('#calendarTab').onclick=()=>switchTab(true);
function renderCalendar(){const grid=$('#calgrid');grid.replaceChildren();grid.className=view==='week'?'weekgrid':'';$('#month').setAttribute('aria-pressed',view==='month');$('#week').setAttribute('aria-pressed',view==='week');let start=new Date(anchor.getFullYear(),anchor.getMonth(),view==='month'?1:anchor.getDate());start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(end.getDate()+6);$('#period').textContent=view==='month'?anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'}):`${start.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} – ${end.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;
for(const name of ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']){const el=document.createElement('div');el.className='weekday';el.textContent=name;grid.append(el);}
for(let i=0;i<(view==='month'?42:7);i++){const date=new Date(start);date.setDate(start.getDate()+i);const k=key(date),items=days[k]||[],card=document.createElement('div');card.className='day'+(date.getMonth()!==anchor.getMonth()&&view==='month'?' outside':'')+(k===key(new Date())?' current':'');const head=document.createElement('button');head.className='datebtn';head.textContent=date.getDate();head.setAttribute('aria-label',date.toLocaleDateString(undefined,{dateStyle:'full'}));head.onclick=()=>openDay(k,date);if(items.length){const count=document.createElement('span');count.textContent=`${items.filter(t=>t.done).length}/${items.length}`;head.append(count);}card.append(head);items.slice(0,view==='month'?3:12).forEach(t=>{const label=document.createElement('label');label.className='task'+(t.done?' done':'');const box=document.createElement('input');box.type='checkbox';box.checked=t.done;box.onchange=()=>{t.done=box.checked;saveDays();renderCalendar();};const txt=document.createElement('span');txt.textContent=t.text;label.append(box,txt);card.append(label);});const add=document.createElement('button');add.className='addday';add.textContent=items.length>(view==='month'?3:12)?'View all / add':'+ Add';add.setAttribute('aria-label',`Add item for ${k}`);add.onclick=()=>openDay(k,date);card.append(add);grid.append(card);}}
function openDay(k,date){selected=k;$('#dayTitle').textContent=date.toLocaleDateString(undefined,{dateStyle:'full'});$('#entryText').value='';renderDay();$('#dayDialog').showModal();$('#entryText').focus();}
function renderDay(){const list=$('#dayItems');list.replaceChildren();(days[selected]||[]).forEach((t,i)=>{const row=document.createElement('div');row.className='editrow';const box=document.createElement('input');box.type='checkbox';box.checked=t.done;box.setAttribute('aria-label','Completed: '+t.text);box.onchange=()=>{t.done=box.checked;saveDays();renderCalendar();};const txt=document.createElement('input');txt.type='text';txt.maxLength=500;txt.value=t.text;txt.setAttribute('aria-label','Edit daily item');txt.oninput=()=>{t.text=txt.value;box.setAttribute('aria-label','Completed: '+t.text);saveDays();renderCalendar();};const del=document.createElement('button');del.type='button';del.textContent='×';del.setAttribute('aria-label','Delete '+t.text);del.onclick=()=>{if(!confirm('Delete this item?'))return;days[selected].splice(i,1);saveDays();renderDay();renderCalendar();};row.append(box,txt,del);list.append(row);});}
$('#dayForm').onsubmit=e=>{e.preventDefault();const text=$('#entryText').value.trim();if(!text)return;if(!days[selected])days[selected]=[];days[selected].push({text,done:false});$('#entryText').value='';saveDays();renderDay();renderCalendar();$('#entryText').focus();};$('#closeDay').onclick=()=>$('#dayDialog').close();
$('#month').onclick=()=>{view='month';renderCalendar();};$('#week').onclick=()=>{view='week';renderCalendar();};$('#today').onclick=()=>{anchor=new Date();renderCalendar();};function shift(n){if(view==='month')anchor=new Date(anchor.getFullYear(),anchor.getMonth()+n,1);else anchor.setDate(anchor.getDate()+7*n);renderCalendar();}$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:3,notes,days,stretches},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='corkboard-backup-'+key(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error();const data=JSON.parse(await f.text()),old=Array.isArray(data),incoming=old?data:data.notes;validate(incoming);if(!old){validDays(data.days);if(data.stretches!==undefined)validateStretches(data.stretches);}if(!confirm(old?'Replace sticky notes with this backup? Calendar stays unchanged.':'Replace notes and calendar, plus the stretching routine if included, with this backup?'))return;notes=incoming;if(!old){days=data.days;saveDays();if(data.stretches!==undefined){stretches=data.stretches;saveStretches();renderStretches();}}filter='all';$('#search').value='';updateFilters();save();render();renderCalendar();}catch(e){alert('Choose a valid corkboard JSON backup under 10 MB.');}finally{$('#file').value='';}};

const STRETCHKEY='ntobo-stretching-v1';let stretches=[];
function validateStretches(data){if(!Array.isArray(data)||data.length>2000||data.some(t=>!t||typeof t.name!=='string'||typeof t.description!=='string'||t.name.length>200||t.description.length>10000))throw Error('Invalid routine');}
try{const raw=localStorage.getItem(STRETCHKEY);if(raw){const parsed=JSON.parse(raw);validateStretches(parsed);stretches=parsed;}}catch(e){$('#status').textContent='Could not load your routine. Import a backup if needed.';}
function saveStretches(){try{localStorage.setItem(STRETCHKEY,JSON.stringify(stretches));$('#status').textContent='Saved on this device';}catch(e){$('#status').textContent='Saving failed. Export a backup before closing.';}}
$('#stretchTab').onclick=()=>{switchTab(false);$('#board').hidden=true;$('.toolbar').hidden=true;$('#add').hidden=true;$('#notesTab').setAttribute('aria-pressed','false');$('#stretchTab').setAttribute('aria-pressed','true');$('#stretching').hidden=false;renderStretches();};
function renderStretches(){const list=$('#stretchList');list.replaceChildren();$('#stretchCount').textContent=stretches.length+' '+(stretches.length===1?'stretch':'stretches');if(!stretches.length){const empty=document.createElement('div');empty.className='routineempty';empty.textContent='Add a stretch to start your routine.';list.append(empty);}
stretches.forEach((t,i)=>{const row=document.createElement('article');row.className='stretchrow';const num=document.createElement('span');num.className='stretchnumber';num.textContent=String(i+1).padStart(2,'0');const fields=document.createElement('div');fields.className='stretchfields';const name=document.createElement('input');name.type='text';name.maxLength=200;name.placeholder='Stretch name';name.value=t.name;name.setAttribute('aria-label','Stretch '+(i+1)+' name');name.oninput=()=>{t.name=name.value;saveStretches();};const desc=document.createElement('textarea');desc.maxLength=10000;desc.placeholder='Description — how to do it, how long to hold…';desc.value=t.description;desc.setAttribute('aria-label','Stretch '+(i+1)+' description');desc.oninput=()=>{t.description=desc.value;saveStretches();};fields.append(name,desc);const controls=document.createElement('div');controls.className='stretchcontrols';for(const [symbol,label,offset] of [['↑','Move up',-1],['↓','Move down',1]]){const b=document.createElement('button');b.textContent=symbol;b.setAttribute('aria-label',label+' stretch '+(i+1));b.disabled=i+offset<0||i+offset>=stretches.length;b.onclick=()=>{[stretches[i],stretches[i+offset]]=[stretches[i+offset],stretches[i]];saveStretches();renderStretches();};controls.append(b);}const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','Delete stretch '+(i+1));del.onclick=()=>{if((t.name||t.description)&&!confirm('Delete this stretch?'))return;stretches.splice(i,1);saveStretches();renderStretches();};controls.append(del);row.append(num,fields,controls);list.append(row);});}
$('#addStretch').onclick=()=>{stretches.push({name:'',description:''});saveStretches();renderStretches();$('#stretchList').lastElementChild.querySelector('input').focus();};
</script></body></html>
